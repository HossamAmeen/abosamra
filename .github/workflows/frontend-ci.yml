name: frontend-ci

on:
  push:
    paths: ["frontend/**", "backend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["frontend/**", "backend/**", ".github/workflows/frontend-ci.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/e2e/visual/compare
          retention-days: 7

  e2e-real:
    # QA-06: core journeys against the real Django backend (fresh sqlite, seed_abo_samra).
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r backend/requirements/base.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: e2e against the real API
        working-directory: frontend
        run: npm run e2e:real
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-real-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
