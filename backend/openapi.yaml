          title: العنوان الافتراضي
        area:
          type: string
          title: المنطقة
          maxLength: 80
    PaymentMethodEnum:
      enum:
      - cod
      type: string
      description: '* `cod` - الدفع عند الاستلام'
    Product:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          title: المعرّف
          oneOf:
          - type: string
            pattern: ^[-\w]+$
            maxLength: 160
          - type: string
            maxLength: 0
        name:
          type: string
          title: الاسم
          maxLength: 120
        description:
          type: string
          title: الوصف
        image:
          type: string
          format: uri
          nullable: true
          readOnly: true
        is_available:
          type: boolean
          title: متاح
        is_featured:
          type: boolean
          title: مميز
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryBrief'
          readOnly: true
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
          readOnly: true
        active_offer:
          allOf:
          - $ref: '#/components/schemas/ActiveOffer'
          nullable: true
          readOnly: true
      required:
      - active_offer
      - category
      - id
      - image
      - name
      - variants
    Quote:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/QuoteLine'
        subtotal:
          type: integer
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/QuoteDiscount'
        discount_total:
          type: integer
        delivery_fee:
          type: integer
        free_delivery_threshold:
          type: integer
        free_delivery_remaining:
          type: integer
        total:
          type: integer
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/QuoteWarning'
      required:
      - delivery_fee
      - discount_total
      - discounts
      - free_delivery_remaining
      - free_delivery_threshold
      - lines
      - subtotal
      - total
      - warnings
    QuoteBundleRequest:
      type: object
      properties:
        offer_id:
          type: integer
        qty:
          type: integer
          maximum: 50
          minimum: 1
      required:
      - offer_id
      - qty
    QuoteDiscount:
      type: object
      properties:
        offer_id:
          type: integer
        label:
          type: string
        amount:
          type: integer
      required:
      - amount
      - label
      - offer_id
    QuoteItemRequest:
      type: object
      properties:
        variant_id:
          type: integer
        qty:
          type: integer
          maximum: 50
          minimum: 1
        note:
          type: string
          default: ''
          maxLength: 200
      required:
      - qty
      - variant_id
    QuoteLine:
      type: object
      properties:
        variant_id:
          type: integer
          nullable: true
        offer_id:
          type: integer
          nullable: true
        name:
          type: string
        unit_label:
          type: string
        qty:
          type: integer
        unit_price:
          type: integer
        line_total:
          type: integer
      required:
      - line_total
      - name
      - offer_id
      - qty
      - unit_label
      - unit_price
      - variant_id
    QuoteRequestRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuoteItemRequest'
        bundles:
          type: array
          items:
            $ref: '#/components/schemas/QuoteBundleRequest'
    QuoteWarning:
      type: object
      properties:
        variant_id:
          type: integer
          nullable: true
        offer_id:
          type: integer
        code:
          $ref: '#/components/schemas/CodeEnum'
        detail:
          type: string
      required:
      - code
      - detail
      - variant_id
    Refresh:
      type: object
      properties:
        refresh:
          type: string
        access:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        phone:
          type: string
          minLength: 1
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
      required:
      - name
      - phone
    ShopSettings:
      type: object
      properties:
        shop_name:
          type: string
          title: اسم المحل
          maxLength: 80
        phone:
          type: string
          title: التليفون
          maxLength: 20
        whatsapp:
          type: string
          title: واتساب
          maxLength: 20
        delivery_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        free_delivery_threshold:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        is_accepting_orders:
          type: boolean
          title: بياخد طلبات
      required:
      - currency
      - delivery_fee
      - free_delivery_threshold
    StatusEnum:
      enum:
      - new
      - preparing
      - out_for_delivery
      - delivered
      - cancelled
      type: string
      description: |-
        * `new` - جديد
        * `preparing` - بيتجهز
        * `out_for_delivery` - في الطريق
        * `delivered` - اتسلم
        * `cancelled` - اتلغى
    TargetIn:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        slug:
          type: string
          nullable: true
        ids:
          type: array
          items:
            type: integer
      required:
      - kind
    TargetInRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        slug:
          type: string
          nullable: true
        ids:
          type: array
          items:
            type: integer
      required:
      - kind
    TypeEnum:
      enum:
      - percentage
      - bundle
      - free_delivery
      type: string
      description: |-
        * `percentage` - نسبة خصم
        * `bundle` - باكدج
        * `free_delivery` - توصيل مجاني
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: الاسم
          maxLength: 80
          minLength: 2
        phone:
          type: string
          readOnly: true
          title: الموبايل
        email:
          title: الإيميل
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        default_address:
          type: string
          title: العنوان الافتراضي
        area:
          type: string
          title: المنطقة
          maxLength: 80
        is_staff:
          type: boolean
          readOnly: true
          title: موظف
      required:
      - id
      - is_staff
      - name
      - phone
    Variant:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          title: الوزن/الوحدة
          maxLength: 40
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        old_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        is_default:
          type: boolean
          title: الافتراضي
      required:
      - id
      - label
      - old_price
      - price
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
