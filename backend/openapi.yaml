openapi: 3.0.3
info:
  title: Abo Samra API
  version: 1.0.0
  description: Backend API for the Abo Samra spice shop store.
paths:
  /api/health/:
    get:
      operationId: health_retrieve
      description: Send the password in the `X-Health-Check-Token` header (preferred)
        or the `password` query parameter.
      summary: Health check
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '403':
          description: Missing or invalid health password
        '429':
          description: Rate limit exceeded
        '503':
          description: Database unavailable
  /api/v1/admin/customers/:
    get:
      operationId: v1_admin_customers_list
      parameters:
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: name or phone
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminCustomerList'
          description: ''
  /api/v1/admin/customers/{id}/orders/:
    get:
      operationId: v1_admin_customers_orders_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminOrderList'
          description: ''
  /api/v1/admin/dashboard/:
    get:
      operationId: v1_admin_dashboard_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
          description: ''
  /api/v1/admin/offers/:
    get:
      operationId: v1_admin_offers_list
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminOffer'
          description: ''
    post:
      operationId: v1_admin_offers_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminOfferRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminOfferRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminOfferRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOffer'
          description: ''
  /api/v1/admin/offers/{id}/:
    get:
      operationId: v1_admin_offers_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOffer'
          description: ''
    patch:
      operationId: v1_admin_offers_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminOfferRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminOfferRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminOfferRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOffer'
          description: ''
    delete:
      operationId: v1_admin_offers_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/orders/:
    get:
      operationId: v1_admin_orders_list
      parameters:
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: order number, customer name or phone
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - delivered
          - new
          - out_for_delivery
          - preparing
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminOrderList'
          description: ''
  /api/v1/admin/orders/{id}/:
    get:
      operationId: v1_admin_orders_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
          description: ''
    patch:
      operationId: v1_admin_orders_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrderStatusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrderStatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrderStatusRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
          description: ''
        '400':
          description: Invalid status / transition
  /api/v1/admin/orders/counts/:
    get:
      operationId: v1_admin_orders_counts_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCounts'
          description: ''
  /api/v1/admin/products/:
    get:
      operationId: v1_admin_products_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: category id or slug
      - in: query
        name: is_available
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminProductList'
          description: ''
    post:
      operationId: v1_admin_products_create
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminProductRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminProductRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProductRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
          description: ''
  /api/v1/admin/products/{id}/:
    get:
      operationId: v1_admin_products_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
          description: ''
    patch:
      operationId: v1_admin_products_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminProductRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminProductRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminProductRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
          description: ''
    delete:
      operationId: v1_admin_products_destroy
      description: Soft delete (archive + unavailable) when orders reference it, else
        hard delete.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/staff/:
    get:
      operationId: v1_admin_staff_list
      description: Staff accounts that can sign in to the dashboard; POST adds a new
        one.
      parameters:
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminStaffList'
          description: ''
    post:
      operationId: v1_admin_staff_create
      description: Staff accounts that can sign in to the dashboard; POST adds a new
        one.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminStaffRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminStaffRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminStaffRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStaff'
          description: ''
  /api/v1/auth/admin/login/:
    post:
      operationId: v1_auth_admin_login_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '401':
          description: Wrong credentials
        '429':
          description: Rate limit exceeded
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '400':
          description: Invalid phone
        '404':
          description: not_found
        '429':
          description: Rate limit exceeded
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
        '401':
          description: Invalid refresh token
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '400':
          description: Validation error
        '409':
          description: phone_exists
        '429':
          description: Rate limit exceeded
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refresh'
          description: ''
        '401':
          description: Invalid
  /api/v1/cart/quote/:
    post:
      operationId: v1_cart_quote_create
      description: Price a cart. Works for guests; throttled with the `quote` scope.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuoteRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuoteRequestRequest'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
          description: ''
        '400':
          description: Validation error
        '429':
          description: Rate limit exceeded
  /api/v1/categories/:
    get:
      operationId: v1_categories_list
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/me/:
    get:
      operationId: v1_me_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: v1_me_partial_update
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/offers/active/:
    get:
      operationId: v1_offers_active_list
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Offer'
          description: ''
  /api/v1/orders/:
    post:
      operationId: v1_orders_create
      description: Place a cash-on-delivery order (server recomputes everything).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '400':
          description: Validation error
        '401':
          description: Not authenticated
        '409':
          description: cart_changed (body carries a fresh `quote`)
        '429':
          description: Rate limit exceeded
        '503':
          description: Shop is not accepting orders
  /api/v1/orders/{id}/:
    get:
      operationId: v1_orders_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/orders/mine/:
    get:
      operationId: v1_orders_mine_list
      parameters:
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderList'
          description: ''
  /api/v1/products/:
    get:
      operationId: products_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: discounted
        schema:
          type: string
      - in: query
        name: featured
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
  /api/v1/products/{slug}/:
    get:
      operationId: v1_products_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/settings/:
    get:
      operationId: v1_settings_retrieve
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopSettings'
          description: ''
components:
  schemas:
    ActiveOffer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        value:
          type: number
          format: double
      required:
      - id
      - name
      - type
      - value
    AdminCustomer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          title: الاسم
        phone:
          type: string
          readOnly: true
          title: الموبايل
        email:
          type: string
          format: email
          readOnly: true
          title: الإيميل
        default_address:
          type: string
          readOnly: true
          title: العنوان الافتراضي
        area:
          type: string
          readOnly: true
          title: المنطقة
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: تاريخ التسجيل
        orders_count:
          type: integer
          readOnly: true
        total_spent:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        last_order_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - area
      - date_joined
      - default_address
      - email
      - id
      - last_order_at
      - name
      - orders_count
      - phone
      - total_spent
    AdminDashboard:
      type: object
      properties:
        orders_today:
          type: integer
        sales_today:
          type: integer
        pending_count:
          type: integer
        new_customers_week:
          type: integer
        low_stock:
          type: array
          items:
            $ref: '#/components/schemas/LowStockProduct'
      required:
      - low_stock
      - new_customers_week
      - orders_today
      - pending_count
      - sales_today
    AdminLoginRequest:
      type: object
      properties:
        phone:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - phone
    AdminOffer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          title: النوع
        name:
          type: string
          title: الاسم
          maxLength: 120
        description:
          type: string
          title: الوصف
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        target:
          $ref: '#/components/schemas/TargetIn'
        bundle_items:
          type: array
          items:
            $ref: '#/components/schemas/BundleItemIn'
        bundle_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        old_price:
          type: integer
          nullable: true
          readOnly: true
        min_order:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        starts_at:
          type: string
          format: date-time
          title: يبدأ
        ends_at:
          type: string
          format: date-time
          nullable: true
          title: ينتهي
        is_featured:
          type: boolean
          title: عرض الأسبوع
        is_active:
          type: boolean
          title: شغال
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
