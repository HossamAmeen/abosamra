# Run from backend/:  docker compose --env-file .env -f docker/local/docker-compose.yml up --build
# Requires backend/.env (copy from .env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abosamra}
      POSTGRES_USER: ${POSTGRES_USER:-abosamra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: docker/local/Dockerfile
    env_file: ../../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://${POSTGRES_USER:-abosamra}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-abosamra}
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      BACKEND_PORT: "8000"
      RUN_MIGRATIONS: "True"
      BACKUP_DIR: /app/backups
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The token is read from the container's own environment; nothing is printed.
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request
          req = urllib.request.Request(
              "http://127.0.0.1:8000/api/health/",
              headers={"X-Health-Check-Token": os.environ["HEALTH_CHECK_PASSWORD"]},
          )
          urllib.request.urlopen(req, timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - media:/app/media
      - backups:/app/backups

volumes:
  pgdata:
  media:
  backups:
